name: 构建SFI iOS IPA

on:
  push:
    branches: [ dev, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载官方SFI deb包
        run: |
          VER="1.14.1"
          curl -L -o SFI.deb "https://github.com/SagerNet/sing-box/releases/download/v${VER}/SFI-${VER}-iphoneos-arm64.deb"
          ls -lh SFI.deb

      - name: 解包deb并打包IPA
        run: |
          mkdir -p deb_extract
          cd deb_extract
          ar x ../SFI.deb
          tar xJf data.tar.xz
          APP_PATH=$(find "$(pwd)" -name "*.app" -type d | head -1)
          echo "App路径: $APP_PATH"
          
          cd ..
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          APP_NAME=$(basename "$APP_PATH")
          [ "$APP_NAME" != "SFI.app" ] && mv "Payload/$APP_NAME" "Payload/SFI.app"
          zip -r SFI-unsigned.ipa Payload
          ls -lh SFI-unsigned.ipa

      - name: 上传IPA产物
        uses: actions/upload-artifact@v4
        with:
          name: SFI-unsigned-ipa
          path: SFI-unsigned.ipa
          retention-days: 30
