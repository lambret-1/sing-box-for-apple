name: 从源码编译SFI iOS IPA

on:
  push:
    branches: [ dev, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: 检出代码（含submodule）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 查看Xcode版本
        run: |
          xcodebuild -version
          ls Frameworks/Runestone/ 2>/dev/null | head -5

      - name: 解析SPM依赖
        run: |
          xcodebuild -resolvePackageDependencies -project sing-box.xcodeproj 2>&1 | tail -10

      - name: 归档构建
        run: |
          xcodebuild archive \
            -project sing-box.xcodeproj \
            -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SFI.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -80

      - name: 导出未签名IPA
        run: |
          APP_PATH="build/SFI.xcarchive/Products/Applications"
          ls -la "$APP_PATH/"
          mkdir -p Payload
          cp -R "$APP_PATH"/*.app Payload/
          APP_NAME=$(ls Payload/)
          echo "App名称: $APP_NAME"
          zip -r SFI-unsigned.ipa Payload
          ls -lh SFI-unsigned.ipa

      - name: 上传IPA产物
        uses: actions/upload-artifact@v4
        with:
          name: SFI-unsigned-ipa
          path: SFI-unsigned.ipa
          retention-days: 30
