name: 从源码构建SFI iOS IPA

on:
  push:
    branches: [ dev, main ]
  workflow_dispatch:
    inputs:
      libbox_version:
        description: 'Libbox 版本（如 1.14.1，留空使用最新）'
        required: false
        default: ''

env:
  # 使用运行器默认 Xcode 版本，避免指定版本不存在
  DEVELOPER_DIR: ""

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 检出代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 配置 Xcode 版本
        run: |
          # 显示当前 Xcode 版本
          xcodebuild -version
          echo "Xcode 路径: $(xcode-select -p)"

      - name: 下载 Libbox.xcframework
        run: |
          # 默认 libbox 版本
          DEFAULT_LIBBOX_VER="1.14.1"

          # 确定 libbox 版本
          if [ -n "${{ github.event.inputs.libbox_version }}" ]; then
            LIBBOX_VER="${{ github.event.inputs.libbox_version }}"
            echo "使用手动指定版本: $LIBBOX_VER"
          else
            # 尝试获取最新 release 版本号，失败则使用默认版本
            LIBBOX_VER=$(curl -sL --max-time 10 "https://api.github.com/repos/SagerNet/sing-box/releases/latest" | grep '"tag_name"' | sed -E 's/.*"v?([^"]+)".*/\1/' | head -1)
            if [ -z "$LIBBOX_VER" ]; then
              echo "获取最新版本失败，使用默认版本: $DEFAULT_LIBBOX_VER"
              LIBBOX_VER="$DEFAULT_LIBBOX_VER"
            else
              echo "获取到最新版本: $LIBBOX_VER"
            fi
          fi

          echo "使用 Libbox 版本: $LIBBOX_VER"
          echo "LIBBOX_VER=$LIBBOX_VER" >> $GITHUB_ENV

          # 列出 release 中的可用资产（调试用）
          echo "=== Release 资产列表 ==="
          curl -sL "https://api.github.com/repos/SagerNet/sing-box/releases/tags/v${LIBBOX_VER}" | grep '"name"' | head -30
          echo "========================"

          # 尝试多个可能的文件名
          DOWNLOAD_SUCCESS=0
          for FILENAME in "Libbox.xcframework.zip" "Libbox-ios.xcframework.zip" "Libbox.xcframework-ios.zip" "libbox.xcframework.zip"; do
            DOWNLOAD_URL="https://github.com/SagerNet/sing-box/releases/download/v${LIBBOX_VER}/${FILENAME}"
            echo "尝试下载: $DOWNLOAD_URL"
            HTTP_CODE=$(curl -sL -o Libbox.xcframework.zip -w "%{http_code}" "$DOWNLOAD_URL")
            echo "HTTP 状态码: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] && [ -f Libbox.xcframework.zip ] && [ $(stat -f%z Libbox.xcframework.zip) -gt 1000 ]; then
              echo "下载成功: $FILENAME"
              DOWNLOAD_SUCCESS=1
              break
            fi
            rm -f Libbox.xcframework.zip
          done

          if [ $DOWNLOAD_SUCCESS -eq 0 ]; then
            echo "错误: 所有文件名均下载失败"
            echo "请手动检查 release 页面: https://github.com/SagerNet/sing-box/releases/tag/v${LIBBOX_VER}"
            exit 1
          fi

          ls -lh Libbox.xcframework.zip

          # 验证是有效的 zip 文件
          if ! unzip -tq Libbox.xcframework.zip > /dev/null 2>&1; then
            echo "错误: 下载的文件不是有效的 zip 包"
            file Libbox.xcframework.zip
            exit 1
          fi

          # 解压到项目根目录
          unzip -q Libbox.xcframework.zip
          # 检查解压后的目录名
          if [ -d "Libbox.xcframework" ]; then
            echo "找到 Libbox.xcframework"
          else
            echo "未找到 Libbox.xcframework，列出解压内容:"
            ls -la
            # 尝试找到 xcframework 目录并重命名
            XCFW_DIR=$(find . -maxdepth 2 -name "*.xcframework" -type d | head -1)
            if [ -n "$XCFW_DIR" ]; then
              echo "找到 $XCFW_DIR，重命名为 Libbox.xcframework"
              mv "$XCFW_DIR" Libbox.xcframework
            else
              echo "错误: 未找到任何 xcframework 目录"
              exit 1
            fi
          fi
          ls -la Libbox.xcframework/
          echo "Libbox.xcframework 下载并解压完成"

      - name: 安装构建工具
        run: |
          brew install xcbeautify || echo "xcbeautify 安装失败，将使用原始日志"
          which xcbeautify || true

      - name: 解析 Swift Package 依赖
        run: |
          xcodebuild -resolvePackageDependencies \
            -project sing-box.xcodeproj \
            -scheme SFI \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation 2>&1 | tail -20
          echo "SPM 依赖解析完成"

      - name: 构建 iOS 应用（未签名）
        run: |
          set -o pipefail
          xcodebuild build \
            -project sing-box.xcodeproj \
            -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY_NAME="" \
            2>&1 | tee build.log | {
              if command -v xcbeautify &> /dev/null; then
                xcbeautify --quiet
              else
                tail -100
              fi
            }
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "构建失败，显示错误日志:"
            grep -i "error:" build.log | head -30
            exit $BUILD_EXIT
          fi
          echo "构建成功"

      - name: 查找构建产物
        run: |
          APP_PATH=$(find build/DerivedData -name "*.app" -type d | grep -i "SFI" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "未找到 SFI.app，列出所有 .app:"
            find build/DerivedData -name "*.app" -type d | head -10
            exit 1
          fi
          echo "找到应用: $APP_PATH"
          ls -la "$APP_PATH/"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: 打包未签名 IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          APP_NAME=$(basename "$APP_PATH")
          echo "应用名称: $APP_NAME"

          # 重命名为 SFI.app（如果不是）
          if [ "$APP_NAME" != "SFI.app" ]; then
            mv "Payload/$APP_NAME" "Payload/SFI.app"
          fi

          # 移除代码签名相关文件（确保未签名）
          find Payload -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          find Payload -name "embedded.mobileprovision" -delete 2>/dev/null || true

          # 打包 IPA
          IPA_NAME="SFI-unsigned-v${LIBBOX_VER}.ipa"
          zip -qr "$IPA_NAME" Payload
          ls -lh "$IPA_NAME"
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV

          # 同时生成一个不带版本号的文件名
          cp "$IPA_NAME" "SFI-unsigned.ipa"

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: SFI-unsigned-ipa
          path: |
            SFI-unsigned.ipa
            SFI-unsigned-v*.ipa
          retention-days: 30

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
